[project]
name = "maibot-bilibili-autopilot"
version = "0.7.0"
description = "Browse Bilibili recommendations and selectively comment with MaiBot"
requires-python = ">=3.10"
dependencies = [
  "maibot-plugin-sdk>=2.12.0,<3",
  "bilibili-api-python==17.4.2",
  "httpx>=0.27,<1",
  "qrcode>=8,<9",
  "Pillow>=10",
]

[tool.ruff]
line-length = 120
target-version = "py310"

