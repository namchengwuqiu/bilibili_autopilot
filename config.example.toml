# Public defaults. Never copy local credentials, administrator accounts or group IDs here.
[plugin]
enabled = true
config_version = "0.2.0"
admin_users = []

[browse]
backlog_max_items = 24
backlog_max_age_hours = 48
read_retry_base_seconds = 60
max_per_up = 2
max_per_topic = 2
auto_start = true
autonomous_enabled = true
explore_more = false
interval_seconds = 600
max_check_minutes = 20
videos_per_round = 3
videos_per_day = 180
max_duration_seconds = 1200
interests = ""
blocked_keywords = []
blocked_up_uids = []
active_start_hour = 9
active_end_hour = 23
timezone = "Asia/Shanghai"

[comment]
publish_enabled = false
per_day = 12
min_interval_seconds = 2700
max_chars = 160
min_interest = 0.75
similarity_threshold = 0.88

[model]
decision_budget_seconds = 240
review_timeout_seconds = 45
evidence_retention_days = 7
task = "replyer"
candidates = []
timeout_seconds = 90
extra_style = ""
content_max_chars = 12000

[replies]
enabled = true
interval_seconds = 600
per_day = 8
analyses_per_day = 20
per_thread = 3
min_interval_seconds = 900
max_age_hours = 72

[share]
polish_enabled = true
polish_model = ""
polish_timeout_seconds = 30
total_timeout_seconds = 120
qq_group_ids = []

