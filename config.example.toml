# 公开默认配置。请勿在此填写本地登录凭据、管理员账号或实际群号。
[plugin]
# 启用插件
# 关闭后停止后台浏览。默认登录后自动进入自主模式；手动 pause 或发生异常后，需要 start 恢复。
enabled = true
# 配置格式版本（无需修改）
# 由插件自动维护，用于识别配置格式，保持原值即可。
config_version = "0.3.0"
# 管理员账号
# QQ 管理员直接填 QQ 号，保存时自动补全 qq:；其他平台填写 平台:用户号。每项一个账号，留空时普通聊天中无法使用管理命令。
admin_users = []

[browse]
# 最多保留的评论候选数
# 默认保留 24 个视频，可填 1～100。评论冷却或额度用完时，感兴趣的视频可留待之后考虑；超出数量时按兴趣、新鲜度和等待时间择优保留，不保证每个候选都会发表评论。
backlog_max_items = 24
# 评论候选有效期（小时）
# 默认 48 小时＝2 天，可填 1～168。超过有效期的候选不再等待评论机会；发送前仍需重新读取内容并判断，不会直接发送旧草稿。
backlog_max_age_hours = 48
# 读取失败首次重试等待（秒）
# 读取账号、推荐等请求遇到可重试的网络错误时，首次默认等待 60 秒，可填 10～600。连续失败会逐步延长等待，达到重试上限后每小时探测一次；不会自动重发评论。
read_retry_base_seconds = 60
# 每轮同一 UP 主视频上限
# 默认每轮最多分析同一 UP 主的 2 个视频，可填 1～10，避免一轮推荐都来自同一个人。仍受每轮视频分析总上限约束。
max_per_up = 2
# 每轮同一题材视频上限
# 默认每轮最多分析同一已知分区题材的 2 个视频，可填 1～10，让内容更丰富。没有题材信息的视频不强行归类；仍受每轮视频分析总上限约束。
max_per_topic = 2
# 登录后自动开始
# 默认开启，扫码成功后无需发送 start。运行状态在重启后保留；手动 pause 或异常暂停不会被自动解除。关闭后首次使用需发送 start。
auto_start = true
# 自主决定刷不刷 B 站
# 开启后，麦麦结合人设、兴趣、时间和最近浏览反馈决定刷不刷，也可以选择晚些再看。关闭后按浏览间隔定时刷。评论仍单独判断。
autonomous_enabled = true
# 更积极地探索新视频
# 开启后，有感兴趣的新推荐时更愿意先看一两条，不因最近没有想发的评论就一直休息。仍由麦麦自主决定，不保证浏览或评论比例。关闭时维持随性节奏。
explore_more = false
# 最短浏览意愿检查间隔（秒）
# 自主模式下至少间隔多久再考虑刷 B 站，默认 600 秒＝10 分钟，最少 300 秒＝5 分钟。麦麦可在最短和最长间隔之间决定等待多久；关闭自主判断后按此固定间隔运行。
interval_seconds = 600
# 最长浏览意愿检查间隔（分钟）
# 默认 20 分钟，可填 5～360，不能小于最短检查间隔。模型不能自行休息超过这个上限；调小后，当前尚未结束的等待也会缩短。非活动时段和每日视频额度仍然生效。
max_check_minutes = 20
# 每轮最多分析视频数
# 一轮最多读取并分析几个视频，默认 3 个，可填 1～10。每轮最多发表 1 条评论。
videos_per_round = 3
# 每日视频分析上限
# 达到上限后当天停止分析，手动预览也计入。默认每天 180 个，按所选时区的零点重新统计。
videos_per_day = 180
# 视频最长时长（秒）
# 超过此时长的视频直接跳过。默认 1200 秒＝20 分钟，可填 30～7200 秒。
max_duration_seconds = 1200
# 感兴趣的话题
# 告诉麦麦你希望它关注哪些内容，例如科普、游戏或音乐。留空时结合麦麦人设和账号推荐自行判断。
interests = ""
# 屏蔽关键词
# 标题、简介或读取到的视频内容包含任意一个关键词，就跳过该视频。每项填一个词，留空不限制。
blocked_keywords = []
# 屏蔽的 UP 主 UID
# 不浏览这些 UP 主的视频。填写 B 站个人空间中的数字 UID，不是昵称；每项一个，留空不屏蔽。
blocked_up_uids = []
# 开始浏览时间（小时）
# 使用 24 小时制，填 0～23。例如填 9 表示从每天 09:00 开始允许自动浏览。
active_start_hour = 9
# 结束浏览时间（小时）
# 例如填 23 表示从 23:00 起停止。结束时间早于开始时间表示跨午夜；两者相同表示全天运行。
active_end_hour = 23
# 活动与统计时区
# 活动时段和每日限额都按这个时区计算。默认 Asia/Shanghai，表示北京时间，通常保持默认即可。
timezone = "Asia/Shanghai"

[comment]
# 自动发表评论
# 关闭时只生成预览记录；开启后，运行中的插件可把评论发到 B 站。使用 /bili_auto start 启动；/bili_auto preview 始终只预览。
publish_enabled = false
# 每日评论发送上限
# 默认每天最多 12 次发送尝试，可填 1～200。失败或结果未知也计入；达到上限后停止发送一级评论，仍可浏览视频。与跟进回复的每日额度分开统计，按所选时区零点重新统计。
per_day = 12
# 评论最短间隔（秒）
# 发送视频下一级评论前，距离最近一次评论或跟进回复至少等待多久。默认 2700 秒＝45 分钟；跟进别人回复使用下面独立的最短间隔。
min_interval_seconds = 2700
# 单条评论最大字数
# 默认最多 160 字，可填 20～500。模型生成的评论超过上限时会跳过，不会直接截断后发送。
max_chars = 160
# 发表评论的最低兴趣分
# 可填 0～1，默认 0.75。越高越挑剔，低于该分数就不评论；这是模型的兴趣评分，不是发表评论的概率。
min_interest = 0.75
# 重复评论相似度阈值
# 与近期评论的相似度达到此值就跳过。默认 0.88，可填 0.5～1；越低查重越严格。完全重复的文字始终拦截。
similarity_threshold = 0.88

[model]
# 评论与回复处理总时限（秒）
# 每条评论或跟进回复从生成到依据复核共用的时间预算，包含最多一次重生成。默认 240 秒＝4 分钟，可填 20～900；达到总时限后停止本次处理，不发送未完成复核的正文。
decision_budget_seconds = 240
# 单次正文依据复核时限（秒）
# 检查生成正文是否得到已读取内容支持，默认每次最多等待 45 秒，可填 1～120。超时或复核不通过时不发送该正文，同时受相应处理总时限约束。
review_timeout_seconds = 45
# 内容依据缓存保留天数
# 默认保留本地引用片段和时间位置 7 天，可填 1～30，供后续分享等处理查阅。这里只控制内容依据缓存，不是浏览和评论历史记录的保留期限。
evidence_retention_days = 7
# 评论使用的模型任务
# 填写麦麦模型配置中已有的任务名。默认 replyer，使用麦麦的回复模型；这里不是填写模型厂商或具体型号。
task = "replyer"
# 候选模型（按顺序尝试）
# 填写麦麦已配置的具体模型名，每项一个。单个模型超时后换下一个，每轮每个模型最多尝试一次；留空时由模型任务选择。
candidates = []
# 模型回答等待时间（秒）
# 每个候选模型最多等待多久，默认 90 秒，可填 10～180 秒。超时换下一个；全部超时跳过本次，自动运行保持开启。
timeout_seconds = 90
# 额外评论风格
# 在麦麦原有人设基础上补充评论语气，例如简短、自然、少用表情。留空时沿用麦麦人设。
extra_style = ""
# 最多读取的字幕或摘要字数
# 默认最多向模型提供12000字。长字幕兼顾相关片段、开头、中段和结尾，保留时间位置；不读取画面或音频。
content_max_chars = 12000

[replies]
# 启用跟进回复
# 默认开启。只处理别人直接回复麦麦已发送评论的消息，不处理私信、单独 @ 或无关楼层。实际发送仍受“自动发表评论”总开关控制。
enabled = true
# 收到回复检查间隔（秒）
# 默认 600 秒＝10 分钟，不受麦麦是否想刷视频影响。暂停、退出账号或非活动时段不自动检查。
interval_seconds = 600
# 每日跟进回复发送上限
# 默认每天最多 8 次发送尝试，可填 1～200。失败或结果未知也计入；与视频下一级评论的每日额度分开统计。达到上限后保留待处理回复，在有效期内下次再考虑；按所选时区零点重新统计。实际发送还受每日分析额度、发送间隔和单条讨论次数限制。
per_day = 8
# 每日收到回复分析上限
# 默认每天最多分析 20 条，手动预览也计入；与视频分析额度分开统计，防止收到大量回复时持续调用模型。
analyses_per_day = 20
# 同一条讨论最多跟进次数
# 默认在一条根评论下最多跟进 3 次，按账号长期累计，失败也计入，防止与别人反复对话。
per_thread = 3
# 跟进回复最短发送间隔（秒）
# 默认 900 秒＝15 分钟，从最近一次评论或跟进回复发送尝试算起；等待期间保留收到的消息，下次检查时再考虑。
min_interval_seconds = 900
# 只跟进最近多少小时的回复
# 默认 72 小时＝3 天，可填 1～168，避免上线后突然回复很久以前的讨论。每次最多读取三页通知。
max_age_hours = 72

[share]
# 润色群分享文案
# 默认开启，在分享草稿基础上再润色一次，让表达更自然。同一视频发往多个群时复用文案；关闭后使用已通过依据复核的初稿。
polish_enabled = true
# 分享文案润色模型
# 填写麦麦已配置的具体模型名称，最多 200 字；留空沿用评论使用的模型任务及候选模型设置。仅在开启分享文案润色时生效。
polish_model = ""
# 分享文案润色时限（秒）
# 润色及润色稿依据复核合计最多等待多久，默认 30 秒，可填 1～120。润色未完成或未通过复核时使用已通过复核的初稿；仍受分享文案处理总时限约束。
polish_timeout_seconds = 30
# 分享文案处理总时限（秒）
# 分享草稿生成、修改、润色和依据复核共用的时间预算，默认 120 秒＝2 分钟，可填 10～360。达到总时限后放弃本次分享，不影响已经成功发布的 B 站评论。
total_timeout_seconds = 120
# 分享视频的 QQ 群号
# 默认留空，不分享。每项填写一个麦麦已加入的 QQ 群号，最多 10 个。仅实际提交成功的视频一级评论触发，预览、跳过和跟进回复不触发。发送分享感想和视频链接。同一视频对同一群只尝试分享一次，失败或结果未知不会自动重发。
qq_group_ids = []

