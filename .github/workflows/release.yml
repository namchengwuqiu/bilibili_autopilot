name: Publish plugin release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.6.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version and build package
        run: >-
          python scripts/validate_release.py --tag "$RELEASE_TAG"
          --archive dist/bilibili-autopilot.zip --notes dist/release-notes.md
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated tests
        run: python scripts/run_tests.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/bilibili-autopilot.zip dist/bilibili-autopilot.zip.sha256 \
            --verify-tag --title "B站自主浏览与评论 $RELEASE_TAG" \
            --notes-file dist/release-notes.md
